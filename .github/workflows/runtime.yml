name: lampkit runtime
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: |
          python -m lampkit simulate scenarios/demo.json --log /tmp/demo.jsonl
          python -m lampkit replay /tmp/demo.jsonl
