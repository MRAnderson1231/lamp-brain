[project]
name = "lamp-brain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlx-vlm>=0.7.12",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
# lampkit's core needs only the standard library; these are for the live sensors
live = ["mediapipe>=0.10"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
